<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Acceso empleados</title>

    <link
        rel="stylesheet"
        href="css/login.css"
    >

</head>


<body>


<div class="login-container">


    <div class="login-box">


        <div class="logo">
            COMERCIO
        </div>


        <h1>
            Acceso de empleados
        </h1>


        <p class="descripcion">
            Introduce tus credenciales.
        </p>


        <form id="loginForm">


            <label for="usuario">
                Usuario
            </label>

            <input
                type="text"
                id="usuario"
                placeholder="Usuario"
                required
            >


            <label for="password">
                Contraseña
            </label>

            <input
                type="password"
                id="password"
                placeholder="Contraseña"
                required
            >


            <button type="submit">
                Iniciar sesión
            </button>


            <p
                id="error"
                class="error"
            ></p>


        </form>


        <a
            href="index.html"
            class="volver"
        >
            ← Volver
        </a>


    </div>


</div>


<script src="js/login.js"></script>


</body>

</html>
